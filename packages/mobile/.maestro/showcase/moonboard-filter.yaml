appId: com.boardsesh.app
name: showcase take - native MoonBoard grade filter
---
# A complete genuine sheet keeps the successful path. One real Close/reopen
# may recover a collapsed native host; incomplete controls still fail the take.
- evalScript: ${http.get(SHOWCASE_SIGNAL_URL + '/mark/flow-start')}
- waitForAnimationToEnd:
    timeout: 30000
- extendedWaitUntil:
    visible: '${SHOWCASE_FILTER_GRADE_CONTROL}'
    timeout: 5000
    optional: true
- evalScript: ${output.moonboardFilterRecovery = false}
- runFlow:
    when:
      notVisible:
        id: 'climb-filter-column'
    commands:
      - evalScript: ${output.moonboardFilterRecovery = true}
- runFlow:
    when:
      notVisible: '${SHOWCASE_FILTER_TITLE}'
    commands:
      - evalScript: ${output.moonboardFilterRecovery = true}
- runFlow:
    when:
      notVisible: '${SHOWCASE_FILTER_NAME}'
    commands:
      - evalScript: ${output.moonboardFilterRecovery = true}
- runFlow:
    when:
      notVisible: '${SHOWCASE_FILTER_DIFFICULTY}'
    commands:
      - evalScript: ${output.moonboardFilterRecovery = true}
- runFlow:
    when:
      notVisible: '${SHOWCASE_FILTER_GRADE_RANGE}'
    commands:
      - evalScript: ${output.moonboardFilterRecovery = true}
- runFlow:
    when:
      notVisible: '${SHOWCASE_FILTER_GRADE_CONTROL}'
    commands:
      - evalScript: ${output.moonboardFilterRecovery = true}
- runFlow:
    when:
      true: ${output.moonboardFilterRecovery}
    commands:
      - tapOn: '${SHOWCASE_FILTER_CLOSE}'
      - extendedWaitUntil:
          notVisible: '${SHOWCASE_FILTER_CLOSE}'
          timeout: 15000
      - waitForAnimationToEnd:
          timeout: 30000
      - assertVisible:
          id: 'climbs-screen'
      - tapOn: '${SHOWCASE_FILTER_BUTTON}'
      - waitForAnimationToEnd:
          timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'climb-filter-column'
    timeout: 15000
- assertVisible:
    id: 'climb-filter-column'
- extendedWaitUntil:
    visible: '${SHOWCASE_FILTER_TITLE}'
    timeout: 15000
- assertVisible: '${SHOWCASE_FILTER_TITLE}'
- extendedWaitUntil:
    visible: '${SHOWCASE_FILTER_NAME}'
    timeout: 15000
- assertVisible: '${SHOWCASE_FILTER_NAME}'
- extendedWaitUntil:
    visible: '${SHOWCASE_FILTER_DIFFICULTY}'
    timeout: 15000
- assertVisible: '${SHOWCASE_FILTER_DIFFICULTY}'
- extendedWaitUntil:
    visible: '${SHOWCASE_FILTER_GRADE_RANGE}'
    timeout: 15000
- assertVisible: '${SHOWCASE_FILTER_GRADE_RANGE}'
- extendedWaitUntil:
    visible: '${SHOWCASE_FILTER_GRADE_CONTROL}'
    timeout: 15000
- assertVisible: '${SHOWCASE_FILTER_GRADE_CONTROL}'
- evalScript: ${http.get(SHOWCASE_SIGNAL_URL + '/mark/grade-filter-shown')}
- extendedWaitUntil:
    visible: 'zzz-showcase-pause'
    timeout: 8000
    optional: true
