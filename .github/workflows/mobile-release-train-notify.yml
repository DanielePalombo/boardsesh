name: Announce Mobile Release Train

on:
  push:
    branches: [release/next]
    paths: ['packages/mobile/app.config.ts']

permissions:
  contents: read

concurrency:
  group: mobile-release-train-announcements
  cancel-in-progress: false
  queue: max

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    steps:
      # Train source is inspected as text. Only main's tooling sees the webhook.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
      - name: Identify a newly cut train version
        id: cut
        env:
          TRAIN_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TRAIN_SHA"
          if ! [[ "$BEFORE_SHA" =~ ^0{40}$ ]]; then git fetch --no-tags origin "$BEFORE_SHA"; fi
          node --experimental-strip-types scripts/mobile-release-train-policy.ts \
            --main-sha "$(git rev-parse HEAD)" --train-sha "$TRAIN_SHA" --before-sha "$BEFORE_SHA" >> "$GITHUB_OUTPUT"
      - name: Record release cut
        if: steps.cut.outputs.train_cut == 'true'
        env:
          TRAIN_SHA: ${{ github.sha }}
          TRAIN_VERSION: ${{ steps.cut.outputs.train_version }}
        run: |
          node --experimental-strip-types scripts/mobile-ota-notify.ts record \
            --events train-cut-events.json --kind train-cut --branch release/next \
            --commit "$TRAIN_SHA" --version "$TRAIN_VERSION" \
            --key "train-cut:$TRAIN_SHA" --reason 'Tester release opened; public submission follows its merge into main.'
      - name: Announce release cut
        if: steps.cut.outputs.train_cut == 'true'
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
        run: node --experimental-strip-types scripts/mobile-ota-notify.ts deliver --events train-cut-events.json
      - name: Retain announcement receipt
        if: always() && steps.cut.outputs.train_cut == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: train-cut-events
          path: train-cut-events.json
          retention-days: 30
          if-no-files-found: error
