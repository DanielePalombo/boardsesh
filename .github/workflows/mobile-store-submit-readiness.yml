name: Merge-back Readiness (builds)

# On a merge-back PR (release/next into main), answers before anyone merges it:
# would the automatic store submission (mobile-store-submit.yml) find a build pair
# to submit? Both uploaded builds must exist for the train version and resolve to
# the same native fingerprints as the would-be merge commit, the check the
# submission's draft job repeats with the real build environment. Also warns when
# the release notes did not change since the previous merge-back.
#
# Store state (reviews in progress, the App Store version's screenshots) needs
# store credentials, which a pull_request run must not have while it executes PR
# code: mobile-store-submit-readiness-stores.yml answers that half under
# pull_request_target, without checking out the PR.
#
# Security: plain pull_request, no secrets, no environment, a read-only token. It
# runs the PR's code (fingerprint resolution evaluates app.config.ts), which is
# what every PR check does. Fingerprints resolve without the Maps key on both
# sides, so they compare like for like; the submission's draft job, which has the
# key and the public build environment, stays the authoritative check.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: merge-back-readiness-builds-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # gh pr list: the previous merge-back

jobs:
  builds:
    name: Build pair matches the merge
    # Only this repository's release train. A fork's branch can carry the same name.
    if: github.event.pull_request.head.ref == 'release/next' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The merge ref (release/next merged into main): the commit a merge-back
      # creates, so main's native changes count too.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install tooling without lifecycle scripts
        run: vp install --frozen-lockfile --ignore-scripts

      - name: Version and release notes
        id: facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/mobile-store-submit-target.ts --candidate "$(git rev-parse HEAD)"

      - name: Select the uploaded build pair
        id: candidate
        env:
          VERSION: ${{ steps.facts.outputs.version }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/candidates"
          : > "$result"
          CHECK_ONLY=true CANDIDATE_ONLY=true UPLOADED_ONLY=true HEAD_VERSION="$VERSION" \
            GITHUB_OUTPUT="$result" node --import tsx scripts/mobile-cut-release-tags.ts
          cat "$result" >> "$GITHUB_OUTPUT"
          if [ "$(sed -n 's/^candidates_found=//p' "$result" | tail -n 1)" != true ]; then
            echo "::error::No uploaded iOS and Android build pair for $VERSION yet (build-<platform>-v$VERSION-* tags). The submission would have nothing to submit."
            echo "- ❌ No uploaded iOS and Android build pair for **$VERSION** yet." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Checkout the merge without credentials
        uses: actions/checkout@v4
        with:
          path: merge-head
          persist-credentials: false

      - name: Checkout the tagged iOS build without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.ios_build_sha }}
          path: ios-build
          persist-credentials: false

      - name: Checkout the tagged Android build without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.android_build_sha }}
          path: android-build
          persist-credentials: false

      - name: Install fingerprint dependencies without lifecycle scripts
        run: |
          set -euo pipefail
          for tree in merge-head ios-build android-build; do
            (cd "$tree" && vp install --frozen-lockfile --ignore-scripts)
          done

      - name: Compare fingerprints
        env:
          VERSION: ${{ steps.facts.outputs.version }}
          IOS_TAG: ${{ steps.candidate.outputs.ios_build_tag }}
          ANDROID_TAG: ${{ steps.candidate.outputs.android_build_tag }}
        run: |
          set -euo pipefail
          resolve() {
            local raw
            raw="$(cd "$1/packages/mobile" && env -u GOOGLE_MAPS_API_KEY vp exec expo-updates runtimeversion:resolve --platform "$2" 2>/dev/null || true)"
            jq -r '.runtimeVersion // empty' <<<"$raw" 2>/dev/null | tr '[:upper:]' '[:lower:]' || true
          }
          matches=true
          for platform in ios android; do
            if [ "$platform" = ios ]; then tree=ios-build; tag="$IOS_TAG"; else tree=android-build; tag="$ANDROID_TAG"; fi
            merge_fp="$(resolve merge-head "$platform")"
            build_fp="$(resolve "$tree" "$platform")"
            if printf '%s' "$merge_fp" | grep -qE '^[0-9a-f]{12,}$' && [ "$merge_fp" = "$build_fp" ]; then
              echo "- ✅ $platform: \`$tag\` matches the merge (${merge_fp:0:12})." >> "$GITHUB_STEP_SUMMARY"
            else
              matches=false
              echo "::error::$platform: the merge resolves ${merge_fp:-<unresolved>}, but $tag resolves ${build_fp:-<unresolved>}. The submission would refuse this build."
              echo "- ❌ $platform: \`$tag\` does not match the merge (merge ${merge_fp:-unresolved}, build ${build_fp:-unresolved}). Let the train rebuild, or merge main into the train first." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          [ "$matches" = true ]

      - name: Remind how to merge
        if: always()
        run: echo "- Merge with a **merge commit**, not a squash, or the changelog drops the train's PRs." >> "$GITHUB_STEP_SUMMARY"
